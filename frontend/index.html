<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vecino Recomienda</title>
<style>body{font-family:system-ui,sans-serif;max-width:720px;margin:24px auto;padding:0 16px} h1{font-size:26px} .badge{background:#111;color:#fff;padding:4px 10px;border-radius:999px;font-size:13px} button{padding:10px 16px;cursor:pointer} input,textarea{width:100%;padding:10px;margin:4px 0 10px;box-sizing:border-box} .card{border:1px solid #ddd;border-radius:10px;padding:14px;margin:10px 0} .sello{background:#e6f4ea;padding:2px 8px;border-radius:999px;font-size:13px}</style>
</head><body>
<span class="badge">VECINO RECOMIENDA · HACKATHON UTP 2026</span>
<h1>Vecino Recomienda</h1>
<p>Lo que necesitas a 3 cuadras, con el visto bueno de quien ya lo probó. Publicas en <b>3 clics</b>, sin registro pesado.</p>
<h2>Publicar un servicio (3 clics)</h2>
<form id="f" onsubmit="return publicar(event)">
<label>1. ¿Qué ofreces? <input id="oficio" placeholder="Ej: Cerrajería 24h" required></label>
<label>2. Descríbelo en una línea <input id="descripcion" placeholder="Ej: Aperturas y cambios de chapa" required></label>
<label>3. Tu nombre <input id="vecino" placeholder="Ej: Luis Torres" required></label>
<button type="submit">Publicar</button>
<p id="msg"></p>
</form>
<h2>Cerca de ti (ordenado por distancia)</h2>
<ul id="lista" style="list-style:none;padding:0"></ul>
<script>
let LAT=-11.981, LNG=-77.072;
if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>{LAT=p.coords.latitude;LNG=p.coords.longitude;cargar();},()=>{}, {timeout:3000});}
async function cargar(){
  const r=await fetch(`/api/servicios?lat=${LAT}&lng=${LNG}`);
  const data=await r.json();
  document.getElementById('lista').innerHTML=data.map(s=>`
    <li class="card"><b>${s.oficio}</b> — ${s.descripcion}<br>
    <small>${s.vecino}${s.barrio?' · '+s.barrio:''} · a ${s.distancia_km} km</small><br>
    ${s.visto_bueno?`<span class="sello">✓ Visto bueno vecinal (${s.vistos})</span>`:`<span>Sin visto bueno aún</span>`}
    <button style="margin-left:8px" onclick="recomendar(${s.id})">Recomendar</button></li>`).join('');
}
async function publicar(e){
  e.preventDefault();
  const body={oficio:oficio.value, descripcion:descripcion.value, vecino:vecino.value, barrio:'Los Olivos', lat:LAT, lng:LNG};
  const r=await fetch('/api/servicios',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const msg=document.getElementById('msg');
  msg.textContent = r.ok ? 'Publicado. ¡Gracias por compartir!' : 'Revisa los campos.';
  if(r.ok){e.target.reset();cargar();}
  return false;
}
async function recomendar(id){
  await fetch(`/api/servicios/${id}/recomendar`,{method:'POST'});
  cargar();
}
cargar();
</script></body></html>
